<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚔️ Sala de Facciones — Academia hachimaki</title>
  <meta name="description" content="Salón de la fama y guerra de facciones." />
  <script src="../js/theme-engine.js"></script>
  <link rel="stylesheet" href="../css/themes.css" />
  <link rel="stylesheet" href="../css/utilities.css" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/auth.css" />
  <link rel="stylesheet" href="../css/social-dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="../js/theme-selector.js" defer></script>
</head>

<body class="min-h-screen relative overflow-x-hidden">
  <div class="bg-shape" style="width:300px;height:300px;background:var(--t-shape-1);top:10%;left:-5%;"></div>
  <div class="bg-shape" style="width:200px;height:200px;background:var(--t-shape-2);top:60%;right:-3%;"></div>
  <div class="bg-shape" style="width:250px;height:250px;background:var(--t-shape-3);bottom:5%;left:40%;"></div>

  <div id="app" class="relative z-10" style="padding: 1rem 1rem 3rem;">

    <!-- Loading -->
    <div id="loading-screen" v-if="loading">
      <div class="auth-card">
        <div class="spinner"></div>
        <p class="auth-subtitle">Cargando Sala de Facciones...</p>
      </div>
    </div>

    <template v-else>
      <div class="sd-root" style="grid-template-columns: 240px minmax(0, 1fr);">

        <!-- SIDEBAR -->
        <div class="sd-col">
          <div class="sd-card" style="padding:8px">
            <div class="sd-nav">
              <a href="dashboard.html" class="sd-nav-item">⬅ Volver al Dashboard</a>
              <a href="factions.html" class="sd-nav-item active" style="color:var(--t-wrong, #D4537E);">⚔️ Sala de
                Facciones</a>
            </div>
          </div>

          <div class="sd-card" v-if="myFaction">
            <div class="sd-sec">Tu Facción</div>
            <div style="display:flex;align-items:center;gap:8px">
              <img :src="getFactionBadge(myFaction.faction_name)" style="width:36px;height:36px;object-fit:contain" />
              <div>
                <div style="font-size:12px;font-weight:600;color:var(--t-text)">{{ myFaction.faction_name }}</div>
                <div style="font-size:10px;color:var(--t-text-muted)">{{ myFaction.section_code }}</div>
              </div>
            </div>
            <div style="margin-top:10px;font-size:11px;color:var(--t-text-secondary);">
              <b>Ranking Global:</b> #{{ getFactionRank(myFaction.id) }} <br />
              <b>XP Total:</b> {{ myFaction.total_xp.toLocaleString() }}
            </div>
          </div>

          <div class="sd-card">
            <div class="sd-sec">Últimas Victorias</div>
            <div v-if="recentVictories.length === 0" style="font-size:11px;color:var(--t-text-muted)">No hay actividad
              reciente.</div>
            <div v-for="vic in recentVictories" :key="vic.id"
              style="margin-bottom:8px;font-size:11px;color:var(--t-text);">
              <div><strong :style="{color: getFactionColorByName(vic.factionName)}">{{ vic.factionName }}</strong> ganó
                <strong style="color:var(--t-correct-text)">+{{ vic.xp }} XP</strong></div>
              <div style="font-size:9px;color:var(--t-text-muted)">por {{ vic.reason }} (hace {{ vic.timeAgo }})</div>
            </div>
          </div>
        </div>

        <!-- MAIN HALL -->
        <div class="sd-col">
          <div class="fh-header">
            <h1 class="fh-title">Sala de Facciones</h1>
            <p class="fh-subtitle">La batalla por la supremacía del código. Solo una facción dominará el servidor.</p>
          </div>

          <!-- TABS NAVIGATION -->
          <div class="sd-tabs" style="margin-bottom: 16px; display: flex; gap: 8px; border-bottom: 1px solid var(--t-border); padding-bottom: 8px;">
            <button 
              @click="activeTab = 'overview'"
              :style="{ color: activeTab === 'overview' ? 'var(--t-accent)' : 'var(--t-text-muted)', borderBottom: activeTab === 'overview' ? '2px solid var(--t-accent)' : 'none', paddingBottom: '8px' }"
              style="background: none; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s;">
              📊 Resumen
            </button>
            <button 
              v-if="myFaction"
              @click="activeTab = 'challenges'"
              :style="{ color: activeTab === 'challenges' ? 'var(--t-accent)' : 'var(--t-text-muted)', borderBottom: activeTab === 'challenges' ? '2px solid var(--t-accent)' : 'none', paddingBottom: '8px' }"
              style="background: none; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s;">
              ⚔️ Desafíos
            </button>
            <button 
              v-if="myFaction"
              @click="activeTab = 'wall'"
              :style="{ color: activeTab === 'wall' ? 'var(--t-accent)' : 'var(--t-text-muted)', borderBottom: activeTab === 'wall' ? '2px solid var(--t-accent)' : 'none', paddingBottom: '8px' }"
              style="background: none; border: none; cursor: pointer; font-weight: 600; transition: all 0.2s;">
              💬 Mural
            </button>
          </div>

          <!-- TAB 1: OVERVIEW -->
          <template v-if="activeTab === 'overview'">
            <!-- GLOBAL CHART -->
            <div class="fh-global-chart">
              <div class="sd-sec" style="margin-bottom:0">Global Leaderboard (XP Total)</div>
              <div v-for="(f, idx) in factions" :key="f.id" class="fh-bar-row">
                <div class="fh-bar-label">
                  #{{ idx + 1 }} {{ f.faction_name }}
                </div>
                <div class="fh-bar-wrap">
                  <div class="fh-bar-fill"
                    :style="{ width: getXpPercent(f.total_xp) + '%', background: getFactionColorByName(f.faction_name) }">
                    {{ (f.total_xp || 0).toLocaleString() }} XP
                  </div>
                </div>
              </div>
            </div>

            <!-- FACTIONS GRID -->
            <div class="fh-grid">
              <div v-for="f in factions" :key="f.id" class="fh-card"
                :style="{ '--fh-color': getFactionColorByName(f.faction_name) }">
                <div class="fh-card-header">
                  <img :src="getFactionBadge(f.faction_name)" class="fh-badge" />
                  <div>
                    <div class="fh-card-title">{{ f.faction_name }}</div>
                    <div class="fh-card-stats">
                      <div class="fh-card-stat">👨‍💻 <strong>{{ f.members.length }}</strong> miembros</div>
                      <div class="fh-card-stat">⚡ <strong>{{ Math.round((f.total_xp||0) / Math.max(f.members.length,
                          1)).toLocaleString() }}</strong> XP prom.</div>
                    </div>
                  </div>
                </div>

                <div class="fh-members-title">Fuerzas Activas (Nivel y Github)</div>
                <div class="fh-members-grid">
                  <div v-for="m in f.members" :key="m.id" class="fh-member">
                    <img :src="getAvatar(m)" :data-user-id="m.id" data-faction-member />
                    <div class="fh-member-lvl">{{ m.level || 1 }}</div>
                    <div class="fh-member-tooltip">
                      <b>@{{ m.nickname }}</b><br />
                      {{ (m.xp||0).toLocaleString() }} XP<br />
                      <a v-if="m.github_username" :href="'https://github.com/' + m.github_username" target="_blank"
                        class="fh-github-btn">🐙 {{ m.github_username }}</a>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </template>

          <!-- TAB 2: DESAFÍOS -->
          <template v-if="activeTab === 'challenges' && myFaction">
            <div class="sd-card" style="margin-bottom: 16px;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div class="sd-sec">⚔️ Desafíos de {{ myFaction.faction_name }}</div>
                <button 
                  @click="showNewChallengeForm = !showNewChallengeForm"
                  style="background: var(--t-accent); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600;">
                  + Crear Desafío
                </button>
              </div>

              <!-- Formulario crear desafío -->
              <div v-if="showNewChallengeForm" style="background: var(--t-surface-hover); padding: 12px; border-radius: 8px; margin-top: 12px;">
                <input 
                  v-model="newChallenge.title"
                  type="text"
                  placeholder="Título del desafío"
                  style="width: 100%; padding: 8px; border: 1px solid var(--t-border); border-radius: 4px; margin-bottom: 8px; font-size: 12px;"
                />
                <textarea 
                  v-model="newChallenge.description"
                  placeholder="Descripción (opcional)"
                  style="width: 100%; padding: 8px; border: 1px solid var(--t-border); border-radius: 4px; margin-bottom: 8px; font-size: 12px; min-height: 60px;"
                ></textarea>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
                  <div>
                    <label style="display: block; font-size: 10px; color: var(--t-text-muted); margin-bottom: 4px;">XP Objetivo</label>
                    <input 
                      v-model="newChallenge.target_xp"
                      type="number"
                      min="100"
                      style="width: 100%; padding: 6px; border: 1px solid var(--t-border); border-radius: 4px; font-size: 11px;"
                    />
                  </div>
                  <div>
                    <label style="display: block; font-size: 10px; color: var(--t-text-muted); margin-bottom: 4px;">Días</label>
                    <input 
                      v-model="newChallenge.days"
                      type="number"
                      min="1"
                      max="30"
                      style="width: 100%; padding: 6px; border: 1px solid var(--t-border); border-radius: 4px; font-size: 11px;"
                    />
                  </div>
                </div>
                <div style="display: flex; gap: 8px;">
                  <button 
                    @click="submitChallenge(SupabaseManager.getClient())"
                    style="flex: 1; background: var(--t-correct); color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600;">
                    Crear
                  </button>
                  <button 
                    @click="showNewChallengeForm = false"
                    style="flex: 1; background: var(--t-border); color: var(--t-text); border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 11px;">
                    Cancelar
                  </button>
                </div>
              </div>

              <!-- Lista de desafíos -->
              <div v-if="loadingChallenges" style="text-align: center; padding: 20px; color: var(--t-text-muted);">
                Cargando desafíos...
              </div>
              <div v-else-if="challenges.length === 0" style="padding: 12px; color: var(--t-text-muted); font-size: 12px;">
                No hay desafíos activos. ¡Crea uno!
              </div>
              <div v-for="challenge in challenges" :key="challenge.id" style="background: var(--t-surface-hover); padding: 12px; border-radius: 8px; margin-top: 8px;">
                <div style="display: flex; justify-content: space-between;">
                  <div>
                    <div style="font-weight: 600; color: var(--t-text); font-size: 13px;">{{ challenge.title }}</div>
                    <div style="font-size: 11px; color: var(--t-text-muted); margin-top: 4px;">{{ challenge.description }}</div>
                  </div>
                  <div style="text-align: right; font-size: 11px;">
                    <div :style="{ color: challenge.status === 'completed' ? 'var(--t-correct)' : 'var(--t-accent)' }"><strong>{{ challenge.progress_percent }}%</strong></div>
                    <div style="color: var(--t-text-muted); font-size: 10px; margin-top: 2px;">{{ challenge.current_xp }}/{{ challenge.target_xp }} XP</div>
                  </div>
                </div>
                <div style="background: var(--t-border); height: 4px; border-radius: 2px; margin-top: 8px; overflow: hidden;">
                  <div :style="{ width: challenge.progress_percent + '%', height: '100%', background: challenge.status === 'completed' ? 'var(--t-correct)' : 'var(--t-accent)', transition: 'width 0.3s ease' }"></div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 10px; color: var(--t-text-muted);">
                  <div>Por {{ challenge.creator_name }}</div>
                  <div>{{ challenge.hours_remaining > 0 ? challenge.hours_remaining + 'h left' : 'Expirado' }}</div>
                </div>
              </div>
            </div>
          </template>

          <!-- TAB 3: MURAL -->
          <template v-if="activeTab === 'wall' && myFaction">
            <div class="sd-card" style="margin-bottom: 16px;">
              <div class="sd-sec">💬 Mural de {{ myFaction.faction_name }}</div>

              <!-- Formulario nuevo mensaje -->
              <div style="background: var(--t-surface-hover); padding: 12px; border-radius: 8px; margin-bottom: 12px;">
                <textarea 
                  v-model="newWallMessage"
                  placeholder="Escribe algo para tu facción..."
                  maxlength="500"
                  style="width: 100%; padding: 8px; border: 1px solid var(--t-border); border-radius: 4px; font-size: 12px; font-family: inherit; resize: none; height: 60px;"
                ></textarea>
                <div style="display: flex; justify-content: space-between; margin-top: 8px; align-items: center;">
                  <div style="font-size: 10px; color: var(--t-text-muted);">{{ newWallMessage.length }}/500</div>
                  <button 
                    @click="submitWallMessage(SupabaseManager.getClient())"
                    :disabled="!newWallMessage.trim()"
                    style="background: var(--t-accent); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: 600; opacity: newWallMessage.trim() ? 1 : 0.5;"
                  >
                    Publicar
                  </button>
                </div>
              </div>

              <!-- Feed de mensajes -->
              <div v-if="loadingWall" style="text-align: center; padding: 20px; color: var(--t-text-muted);">
                Cargando mural...
              </div>
              <div v-else-if="wallMessages.length === 0" style="padding: 12px; color: var(--t-text-muted); font-size: 12px;">
                El mural está vacío. ¡Sé el primero en escribir!
              </div>
              <div v-for="msg in wallMessages" :key="msg.id" style="background: var(--t-surface-hover); padding: 12px; border-radius: 8px; margin-bottom: 8px;">
                <div style="display: flex; gap: 8px; align-items: flex-start;">
                  <img 
                    :src="msg.avatar_custom_url || getAvatar(msg.avatar_id)"
                    style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; cursor: pointer;"
                    :data-user-id="msg.user_id"
                    data-faction-member
                  />
                  <div style="flex: 1;">
                    <div style="font-weight: 600; font-size: 12px; color: var(--t-text);">{{ msg.nickname }} <span style="font-weight; 400; color: var(--t-text-muted); font-size: 10px;">Lvl {{ msg.level }}</span></div>
                    <div style="font-size: 12px; color: var(--t-text); margin-top: 4px; word-break: break-word;">{{ msg.message }}</div>
                    <div style="font-size: 10px; color: var(--t-text-muted); margin-top: 4px;">{{ formatTimeAgo(new Date(msg.created_at)) }}</div>
                  </div>
                  <button 
                    v-if="msg.user_id === profile.id"
                    @click="deleteWallMessage(SupabaseManager.getClient(), msg.id)"
                    style="background: none; border: none; color: var(--t-wrong); cursor: pointer; font-size: 14px; padding: 0;">
                    ✕
                  </button>
                </div>
              </div>
            </div>
          </template>
        </div>

        </div>
      </div>
    </template>
  </div>

  <script src="../js/supabase-client.js"></script>
  <script src="../js/user-navigation.js"></script>
  <script src="../js/factions-app.js"></script>
</body>

</html>
